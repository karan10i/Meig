version: '3.8'

services:
  # Node.js/Express service
  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: meig-node
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI}
      - AUTH0_SECRET=${AUTH0_SECRET}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_ISSUER_BASE_URL=${AUTH0_ISSUER_BASE_URL}
      - BASE_URL=${BASE_URL}
      - TINYMCE_API_KEY=${TINYMCE_API_KEY}
    depends_on:
      - flask
    networks:
      - meig-network
    volumes:
      - .:/app
      - /app/node_modules

  # Flask service
  flask:
    build:
      context: .
      dockerfile: Dockerfile.flask
    container_name: meig-flask
    ports:
      - "5001:5001"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - FLASK_ENV=development
    networks:
      - meig-network
    volumes:
      - .:/app

networks:
  meig-network:
    driver: bridge
