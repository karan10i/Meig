<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us ✉️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .contact-container {
            max-width: 560px;
            margin: 88px auto 48px;
            padding: 32px 36px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contact-container h1 {
            text-align: center;
            color: #e6edf3;
            margin-bottom: 28px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .contact-container form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .contact-container label {
            font-size: 13px;
            font-weight: 600;
            color: #8b949e;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .contact-container input,
        .contact-container textarea {
            padding: 10px 14px;
            border: 1px solid #30363d;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.15s, background 0.15s;
            background: #1c2128;
            color: #e6edf3;
            width: 100%;
            box-sizing: border-box;
        }

        .contact-container input::placeholder,
        .contact-container textarea::placeholder {
            color: #6e7681;
        }

        .contact-container input:focus,
        .contact-container textarea:focus {
            outline: none;
            border-color: #58a6ff;
            background: #1c2128;
        }

        .contact-container textarea {
            min-height: 140px;
            resize: vertical;
        }

        .contact-container button {
            padding: 10px 24px;
            background: #58a6ff;
            color: #0d1117;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.15s;
            align-self: flex-start;
        }

        .contact-container button:hover {
            background: #79c0ff;
        }

        @media screen and (max-width: 768px) {
            .contact-container {
                margin: 80px 12px 32px;
                padding: 20px 16px;
            }
            .contact-container h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="header"> 
        <a href="Blog.html">Home</a>
        <span class="separator">|</span>
        <a href="conspire.html">Conspire</a>
        <span class="separator">|</span>
        <div class="dropdown">
            <button class="dropdown-button"><a>Links</a></button>
            <div class="dropdown-content">
                <a href="https://www.linkedin.com/in/karan-gupta-50a298251/">LinkedIn</a>
                <a href="https://www.github.com/karan10i">GitHub</a>
                <a href="https://philiphia.blogspot.com">Old Blog</a>
                <a href="https://in.pinterest.com/karangup10/">Pinterest</a>
                <a href="https://x.com/forwardwasit">X</a>
            </div>
        </div>
        <span class="separator">|</span>
        <a href="contact.html">Contact Us</a>
    </div>
    
    <div class="contact-container">
        <h1>Get in Touch</h1>
        <form id="contactForm">
            <div>
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="What would you like to say?" required></textarea>
            </div>

            <button type="submit">Send Message</button>
            <div id="contactStatus" style="margin-top:18px;font-weight:600;"></div>
        </form>
        </div>
        <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            const statusDiv = document.getElementById('contactStatus');
            statusDiv.textContent = '';
            try {
                const res = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, message })
                });
                const data = await res.json();
                if (data.success) {
                    statusDiv.textContent = 'Message sent! Thank you.';
                    statusDiv.style.color = '#53629E';
                    document.getElementById('contactForm').reset();
                } else {
                    statusDiv.textContent = data.error || 'Failed to send.';
                    statusDiv.style.color = 'red';
                }
            } catch (err) {
                statusDiv.textContent = 'Error sending message.';
                statusDiv.style.color = 'red';
            }
        });
        </script>
</body>
</html>
